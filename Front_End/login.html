<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<div class="space-y-4 text-center">
<div class="px-4 py-2 bg-primary/10 rounded-full inline-block">
<p class="text-sm font-bold text-primary">Step 1 of 5</p>
</div>
<h2 class="text-3xl sm:text-4xl font-extrabold text-black dark:text-white tracking-tight">Create your profile</h2>
<p class="text-base text-black/60 dark:text-white/60">Let's get you set up to find your eternal match.</p>
<div class="w-full bg-primary/10 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 20%"></div>
</div>
</div>
<form action="#" class="mt-8 space-y-6" method="POST">
<div class="space-y-4 rounded-md shadow-sm">
<div>
<label class="sr-only" for="first-name">First Name</label>
<input class="form-input appearance-none relative block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-2 border-primary/20 focus:outline-none focus:ring-primary focus:border-primary text-black dark:text-white placeholder-black/40 dark:placeholder-white/40" id="first-name" name="first-name" placeholder="First Name" required="" type="text"/>
</div>
<div>
<label class="sr-only" for="last-name">Last Name</label>
<input class="form-input appearance-none relative block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-2 border-primary/20 focus:outline-none focus:ring-primary focus:border-primary text-black dark:text-white placeholder-black/40 dark:placeholder-white/40" id="last-name" name="last-name" placeholder="Last Name" required="" type="text"/>
</div>
<div>
<label class="sr-only" for="email-address">Email address</label>
<input autocomplete="email" class="form-input appearance-none relative block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-2 border-primary/20 focus:outline-none focus:ring-primary focus:border-primary text-black dark:text-white placeholder-black/40 dark:placeholder-white/40" id="email-address" name="email" placeholder="Email address" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input autocomplete="current-password" class="form-input appearance-none relative block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-2 border-primary/20 focus:outline-none focus:ring-primary focus:border-primary text-black dark:text-white placeholder-black/40 dark:placeholder-white/40" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div>
<label class="sr-only" for="confirm-password">Confirm Password</label>
<input class="form-input appearance-none relative block w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-2 border-primary/20 focus:outline-none focus:ring-primary focus:border-primary text-black dark:text-white placeholder-black/40 dark:placeholder-white/40" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required="" type="password"/>
</div>
</div>
<div>
<button class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-full text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                Next
              </button>
</div>
</form>
