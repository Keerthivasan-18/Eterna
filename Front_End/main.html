<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eterna - Finding Matches</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #2c003e; /* keeping your same purple */
      color: white;
      text-align: center;
    }

    /* Keep Eterna name in top-left */
    .header {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-card {
      margin-top: 100px;
      display: inline-block;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      color: black;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .profile-card img {
      width: 300px;
      height: 400px;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
      color: white;
      text-shadow: 0px 0px 8px rgba(0,0,0,0.7);
    }

    /* Buttons at bottom of picture */
    .actions {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      background: #2c003e; /* same color theme */
    }

    .btn {
      font-size: 28px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.3);
    }

    .reject {
      color: red;
    }

    .accept {
      color: green;
    }
  </style>
</head>
<body>

  <!-- Top Left Header -->
  <div class="header">
    ❤️ Eterna
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <img src="https://via.placeholder.com/300x400" alt="Profile Picture">
    <div class="profile-info">Chloe, 28</div>
    <div class="actions">
      <span class="btn reject">❌</span>
      <span class="btn accept">❤️</span>
    </div>
  </div>

</body>
</html>
